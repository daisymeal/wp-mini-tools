<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A trust meter for the relationship between you and your machine.">
<title>Trust Meter: You vs Your Machine</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Quicksand:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:transparent; }
  #rt { all:initial; font-family:'Quicksand',system-ui,sans-serif; display:block; max-width:600px; margin:0 auto; padding:34px; color:#40364F; line-height:1.6; text-align:center;
    background:linear-gradient(150deg,#F0F6FF 0%,#F6F0FC 45%,#FFF1F6 100%); border:1px solid #E9E3F2; border-radius:28px; box-shadow:0 20px 60px rgba(140,140,190,.15); }
  #rt * { box-sizing:border-box; font-family:inherit; }
  #rt .eyebrow { display:block; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#FF8FAB; font-weight:700; margin:0 0 8px; }
  #rt .title { font-family:'Fraunces',serif; display:block; font-size:26px; font-weight:800; margin:0 0 20px; }
  #rt .gaugeWrap { position:relative; width:260px; height:140px; margin:0 auto 8px; }
  #rt .needle { position:absolute; bottom:6px; left:50%; width:3px; height:100px; background:#40364F; transform-origin:bottom center; transform:rotate(-90deg); transition:transform .8s cubic-bezier(.2,.8,.2,1); border-radius:2px; }
  #rt .needle::after { content:''; position:absolute; bottom:-8px; left:-7px; width:17px; height:17px; background:#40364F; border-radius:50%; }
  #rt .gLabel { display:flex; justify-content:space-between; font-family:'Space Mono',monospace; font-size:10px; color:#8A7E96; width:260px; margin:0 auto 20px; }
  #rt .list { text-align:left; background:#fff; border:1px solid #ECE6F3; border-radius:22px; padding:8px 18px; margin-bottom:18px; }
  #rt .opt { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid #F3EFF8; font-size:14px; }
  #rt .opt:last-child { border-bottom:none; }
  #rt .opt input { width:18px; height:18px; accent-color:#FF8FAB; flex-shrink:0; }
  #rt .status { font-family:'Fraunces',serif; font-size:19px; font-weight:800; min-height:26px; }
</style>
</head>
<body>
<div id="rt">
  <span class="eyebrow">Relationship Diagnostics</span>
  <span class="title">Trust Meter: You vs Your Machine</span>

  <svg width="0" height="0"></svg>
  <div class="gaugeWrap">
    <svg viewBox="0 0 260 140" width="260" height="140" style="position:absolute;top:0;left:0;">
      <path d="M20,130 A110,110 0 0,1 240,130" fill="none" stroke="#F3EFF8" stroke-width="18"/>
      <path d="M20,130 A110,110 0 0,1 88,32" fill="none" stroke="#7FD8C8" stroke-width="18"/>
      <path d="M88,32 A110,110 0 0,1 172,32" fill="none" stroke="#FFC97A" stroke-width="18"/>
      <path d="M172,32 A110,110 0 0,1 240,130" fill="none" stroke="#FF8FAB" stroke-width="18"/>
    </svg>
    <div class="needle" id="needle"></div>
  </div>
  <div class="gLabel"><span>Best Friends</span><span>Filing for Divorce</span></div>

  <div class="list">
    <div class="opt"><input type="checkbox" onchange="rtCalc()" data-w="1"><label>It crashed with no error message</label></div>
    <div class="opt"><input type="checkbox" onchange="rtCalc()" data-w="1"><label>It fixed itself the moment a witness arrived</label></div>
    <div class="opt"><input type="checkbox" onchange="rtCalc()" data-w="1"><label>The logs showed nothing unusual</label></div>
    <div class="opt"><input type="checkbox" onchange="rtCalc()" data-w="1"><label>It worked yesterday and today it does not</label></div>
    <div class="opt"><input type="checkbox" onchange="rtCalc()" data-w="1"><label>You changed nothing and it changed everything</label></div>
    <div class="opt"><input type="checkbox" onchange="rtCalc()" data-w="1"><label>You've started talking to it out loud</label></div>
  </div>
  <div class="status" id="status">Fresh start. Cautiously optimistic.</div>
</div>
<script>
(function(){
  var messages = [
    "Fresh start. Cautiously optimistic.",
    "One betrayal. Could be a fluke.",
    "A pattern is forming. You've noticed.",
    "You've started narrating your bugs to no one.",
    "You no longer believe a single word it says.",
    "Filing for divorce. Custody of the repo is contested."
  ];
  window.rtCalc = function(){
    var boxes = document.querySelectorAll('#rt .opt input');
    var checked = 0;
    boxes.forEach(function(b){ if(b.checked) checked++; });
    var pct = checked/boxes.length;
    var deg = -90 + (pct*180);
    document.getElementById('needle').style.transform = 'rotate('+deg+'deg)';
    document.getElementById('status').textContent = messages[checked];
  };
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Generate a Works On My Machine certification badge for your GitHub README.">
<title>Works On My Machine — Badge Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Quicksand:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:transparent; }
  #rt { all:initial; font-family:'Quicksand',system-ui,sans-serif; display:block; max-width:600px; margin:0 auto; padding:34px; color:#40364F; line-height:1.6;
    background:linear-gradient(150deg,#F0F6FF 0%,#F6F0FC 45%,#FFF1F6 100%); border:1px solid #E9E3F2; border-radius:28px; box-shadow:0 20px 60px rgba(140,140,190,.15); }
  #rt * { box-sizing:border-box; font-family:inherit; }
  #rt .eyebrow { display:block; text-align:center; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#7FD8C8; font-weight:700; margin:0 0 8px; }
  #rt .title { font-family:'Fraunces',serif; display:block; text-align:center; font-size:26px; font-weight:800; margin:0 0 22px; }
  #rt .row { display:flex; gap:10px; margin-bottom:10px; }
  #rt select, #rt input[type=text] { flex:1; padding:11px 13px; font-size:13.5px; border:2px solid #ECE6F3; border-radius:12px; background:#FAF8FD; color:#40364F; }
  #rt button { display:block; width:100%; margin-top:8px; padding:14px; border:none; border-radius:999px; font-weight:700; font-size:15px; color:#fff; background:linear-gradient(120deg,#7FD8C8,#7FB6E8); cursor:pointer; }
  #rt .previewWrap { text-align:center; margin-top:22px; }
  #rt .badge { display:inline-flex; align-items:stretch; height:22px; border-radius:4px; overflow:hidden; font-family:'Verdana',sans-serif; font-size:11px; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  #rt .badge .left { background:#555; color:#fff; padding:0 8px; display:flex; align-items:center; }
  #rt .badge .right { background:#4ecdc4; color:#0a3d3a; padding:0 8px; display:flex; align-items:center; font-weight:bold; }
  #rt .md { margin-top:16px; background:#fff; border:1px solid #ECE6F3; border-radius:14px; padding:12px 14px; font-family:'Space Mono',monospace; font-size:11.5px; color:#8A7E96; text-align:left; word-break:break-all; }
  #rt .copyBtn { margin-top:10px; background:transparent; border:2px solid #E3DCEF; color:#8A7E96; padding:9px 18px; border-radius:999px; font-weight:700; font-size:12.5px; cursor:pointer; width:auto; display:inline-block; }
</style>
</head>
<body>
<div id="rt">
  <span class="eyebrow">README Certification</span>
  <span class="title">Works On My Machine — Badge Maker</span>
  <div class="row">
    <select id="os"><option>macOS</option><option>Windows</option><option>Linux</option><option>WSL (it's complicated)</option></select>
    <input type="text" id="ver" placeholder="version, e.g. 14.2" value="14.2">
  </div>
  <button onclick="rtMake()">Certify my machine</button>
  <div class="previewWrap" id="previewWrap" style="display:none">
    <div class="badge"><span class="left">status</span><span class="right" id="badgeText">✅ works on my machine</span></div>
    <div class="md" id="mdOut"></div>
    <button class="copyBtn" onclick="rtCopy()">Copy markdown</button>
  </div>
</div>
<script>
(function(){
  window.rtMake = function(){
    var os = document.getElementById('os').value;
    var v = document.getElementById('ver').value.trim() || 'unspecified';
    var label = '✅ WORKS ON MY MACHINE — ' + os + ' ' + v;
    document.getElementById('badgeText').textContent = '✅ works on my machine';
    var badgeUrl = 'https://img.shields.io/badge/status-works%20on%20my%20machine-4ecdc4';
    document.getElementById('mdOut').textContent = '![Works on my machine]('+badgeUrl+') <!-- Certified: '+os+' '+v+' — results not guaranteed elsewhere -->';
    document.getElementById('previewWrap').style.display = 'block';
  };
  window.rtCopy = function(){
    var t = document.getElementById('mdOut').textContent;
    navigator.clipboard && navigator.clipboard.writeText(t);
  };
})();
</script>
</body>
</html>
